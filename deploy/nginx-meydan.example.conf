# Exemple : remplacer meydan.example.com par ton nom, obtenir le certificat (certbot --nginx), puis
# mettre MEYDAN_PUBLIC_HOST=meydan.example.com dans meydan.env. Meydan sur un autre port : changer 3070 partout.
# meydan.example.com → Meydan (node, pm2 « meydan », 127.0.0.1:3070) : tableau des terminaux d'agents.
# Accès géré par l'app : identifiant + mot de passe + code à 6 chiffres (data/auth.json : node scripts/creer-acces.mjs <identifiant>). Connexion limitée
# à 10 essais par minute et par adresse (429), puis bannie par fail2ban (jail meydan-limit-req).

limit_req_zone $binary_remote_addr zone=meydan_auth:10m rate=10r/m;

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meydan.example.com;
    ssl_certificate /etc/letsencrypt/live/meydan.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meydan.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/meydan.access.log;
    error_log /var/log/nginx/meydan.error.log;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_http_version 1.1;
    # Host = le nom public, toujours : c'est lui qui fait exiger la connexion par l'app (jamais le lien à clé local).
    proxy_set_header Host meydan.example.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    # Les hooks des agents ne passent que par la boucle locale du serveur, jamais par ici.
    location /hook/ {
        return 404;
    }
    # Même règle pour la commande des agents d'une équipe (bin/meydan → /agent/*) : l'app la refuse déjà sous le nom
    # public, nginx ne la lui transmet même pas.
    location /agent/ {
        return 404;
    }
    location = /login {
        limit_req zone=meydan_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3070;
    }
    # Pièces jointes et notes vocales de la barre d'envoi : seul endroit où un gros corps est accepté (25 Mo par fichier,
    # contrôlé aussi par l'app). La transcription d'une note peut prendre quelques minutes.
    location /api/envois/ {
        client_max_body_size 26m;
        # Le corps n'est pas mis de côté sur le disque avant d'être transmis : sans session, l'app répond 401 tout de
        # suite et rien n'est écrit (sinon des envois anonymes laissés en suspens pourraient remplir le disque).
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3070;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # Terminaux et flux d'état : WebSocket, liaison longue (l'app envoie un ping toutes les 30 s).
    location /ws/ {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host meydan.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    # Aperçu web des cartes du plateau (lib/relais-web.mjs) : un site local relayé derrière la session Meydan. Les
    # formulaires du site relayé peuvent envoyer jusqu'à 10 Mo (la borne du relais lui-même) ; le corps est transmis
    # sans mise de côté sur le disque (sans session, l'app répond 401 tout de suite). Le jeton du relais est dans
    # l'adresse : ce bloc n'écrit pas de journal d'accès. Pas de WebSocket relayé (voulu, docs/volets/plateau-etendu.md).
    location /relais/ {
        client_max_body_size 10m;
        proxy_request_buffering off;
        access_log off;
        proxy_pass http://127.0.0.1:3070;
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name meydan.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
