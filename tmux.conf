# Serveur tmux dédié à Meydan (socket « meydan »), séparé des sessions tmux d'Orkun.
set -g status off
set -g mouse on
set -g history-limit 20000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 0
set -g focus-events on
# Une fenêtre n'a qu'une taille : celle du dernier client actif (attache, touche, clic, molette, focus repris — d'où
# focus-events —, vraie nouvelle taille ; pas la perte du focus). S'il s'en va, le client resté le plus récemment actif
# reprend la sienne. Page redevenue visible : voir le message « a » de /ws/term (server.mjs).
set -g window-size latest
set -g set-clipboard on
